<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Artist Request Page</title>
  <style>
    :root{
      --bg:#050914;
      --panel:#0b1220;
      --card:#111827;
      --card2:#172033;
      --field:#08111f;
      --line:rgba(255,255,255,.12);
      --text:#f8fafc;
      --muted:#9ca8ba;
      --green:#22c55e;
      --green2:#86efac;
      --blue:#38bdf8;
      --purple:#a855f7;
      --pink:#ec4899;
      --gold:#facc15;
      --venmo:#3d95ce;
      --cash:#00d632;
      --shadow:0 24px 70px rgba(0,0,0,.42);
    }

    *{box-sizing:border-box}

    html{
      -webkit-text-size-adjust:100%;
      scroll-behavior:smooth;
    }

    body{
      margin:0;
      min-height:100vh;
      font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at top left,rgba(34,197,94,.16),transparent 28%),
        radial-gradient(circle at top right,rgba(168,85,247,.18),transparent 32%),
        linear-gradient(180deg,#020617 0%,#08111f 55%,#020617 100%);
    }

    a,button,input,textarea{font:inherit}
    a{color:inherit;text-decoration:none}
    button{-webkit-tap-highlight-color:transparent}
    input,textarea{font-size:16px}

    .page{
      width:min(430px,100%);
      margin:0 auto;
      min-height:100vh;
      padding:16px 14px 34px;
    }

    .phone{
      border:1px solid var(--line);
      border-radius:32px;
      background:rgba(8,14,27,.76);
      box-shadow:var(--shadow);
      overflow:hidden;
    }

    .stack{
      display:grid;
      gap:12px;
      padding:14px;
    }

    .click{
      width:100%;
      border:1px solid var(--line);
      color:var(--text);
      background:rgba(255,255,255,.055);
      border-radius:22px;
      cursor:pointer;
      text-align:left;
      transition:transform .14s ease,border-color .14s ease,background .14s ease;
      touch-action:manipulation;
    }

    .click:active{
      transform:scale(.985);
      border-color:rgba(56,189,248,.45);
      background:rgba(255,255,255,.085);
    }

    .hero{
      padding:18px;
      background:
        linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.02)),
        radial-gradient(circle at 10% 0%,rgba(34,197,94,.19),transparent 35%),
        radial-gradient(circle at 95% 12%,rgba(56,189,248,.16),transparent 33%);
      border-bottom:1px solid var(--line);
    }

    .artist-card{
      display:grid;
      grid-template-columns:76px 1fr;
      gap:14px;
      align-items:center;
      padding:0;
      border:0;
      background:transparent;
    }

    .avatar{
      width:76px;
      height:76px;
      border-radius:24px;
      border:2px solid rgba(134,239,172,.85);
      background:
        linear-gradient(135deg,rgba(34,197,94,.35),rgba(168,85,247,.24)),
        url("https://images.unsplash.com/photo-1516280440614-37939bbacd81?auto=format&fit=crop&w=500&q=80") center/cover;
      box-shadow:0 15px 34px rgba(0,0,0,.32);
    }

    h1{
      margin:0;
      font-size:30px;
      line-height:.96;
      letter-spacing:-.05em;
    }

    .tagline{
      margin:6px 0 0;
      color:var(--muted);
      font-size:14px;
      line-height:1.35;
    }

    .live{
      display:inline-flex;
      align-items:center;
      gap:7px;
      width:max-content;
      margin-top:10px;
      padding:7px 10px;
      border-radius:999px;
      color:#c8ffdc;
      background:rgba(34,197,94,.14);
      border:1px solid rgba(34,197,94,.34);
      font-size:12px;
      font-weight:950;
      text-transform:uppercase;
      letter-spacing:.06em;
    }

    .dot{
      width:8px;
      height:8px;
      border-radius:50%;
      background:var(--green);
      box-shadow:0 0 15px var(--green);
    }

    .socials{
      display:grid;
      grid-template-columns:repeat(5,1fr);
      gap:9px;
      margin-top:16px;
    }

    .social{
      min-height:50px;
      display:grid;
      place-items:center;
      border-radius:17px;
      border:1px solid var(--line);
      background:rgba(255,255,255,.06);
      font-size:20px;
      font-weight:950;
    }

    .main-action{
      min-height:68px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      padding:16px;
      background:linear-gradient(135deg,var(--green),var(--blue));
      color:#03120a;
      border:0;
      font-weight:1000;
      font-size:18px;
    }

    .main-action small{
      display:block;
      margin-top:2px;
      color:#052217;
      opacity:.78;
      font-size:12px;
      font-weight:900;
    }

    .arrow{
      font-size:24px;
      opacity:.8;
    }

    .tile{
      padding:16px;
      display:grid;
      gap:12px;
    }

    .tile-head{
      display:flex;
      gap:12px;
      align-items:flex-start;
    }

    .icon{
      width:42px;
      height:42px;
      border-radius:15px;
      display:grid;
      place-items:center;
      flex:0 0 auto;
      background:rgba(34,197,94,.12);
      border:1px solid rgba(34,197,94,.24);
      color:var(--green2);
      font-size:20px;
    }

    h2{
      margin:0;
      font-size:21px;
      line-height:1.06;
      letter-spacing:-.035em;
    }

    .help{
      margin:4px 0 0;
      color:var(--muted);
      font-size:13px;
      line-height:1.35;
    }

    .meta{
      display:flex;
      justify-content:space-between;
      gap:10px;
      padding:12px;
      border-radius:17px;
      background:rgba(255,255,255,.045);
      border:1px solid rgba(255,255,255,.08);
      color:#dbeafe;
      font-size:13px;
      font-weight:900;
    }

    .meta b{color:var(--green2);font-size:18px}

    .bar{
      height:14px;
      border-radius:999px;
      overflow:hidden;
      background:rgba(255,255,255,.09);
      border:1px solid rgba(255,255,255,.06);
    }

    .fill{
      height:100%;
      border-radius:999px;
      background:linear-gradient(90deg,var(--purple),var(--pink));
    }

    .fill.goal{background:linear-gradient(90deg,var(--blue),var(--green))}

    .quick-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
    }

    .quick{
      min-height:52px;
      display:grid;
      place-items:center;
      padding:10px;
      border-radius:18px;
      border:1px solid var(--line);
      background:rgba(255,255,255,.055);
      font-weight:950;
      text-align:center;
    }

    .code{
      margin:0 14px 14px;
      padding:14px;
      display:flex;
      gap:12px;
      align-items:center;
    }

    .ticket{
      width:54px;
      height:54px;
      border-radius:18px;
      display:grid;
      place-items:center;
      background:rgba(34,197,94,.13);
      color:var(--green2);
      font-size:27px;
      flex:0 0 auto;
    }

    .code small{
      display:block;
      color:var(--muted);
      font-size:11px;
      font-weight:950;
      letter-spacing:.08em;
      text-transform:uppercase;
    }

    .code b{
      display:block;
      margin-top:3px;
      color:var(--green2);
      font-size:24px;
      letter-spacing:.05em;
      line-height:1;
    }

    .code span{
      display:block;
      margin-top:4px;
      color:var(--muted);
      font-size:12px;
    }

    .sheet{
      position:fixed;
      inset:0;
      z-index:100;
      display:none;
      align-items:flex-end;
      justify-content:center;
      background:rgba(0,0,0,.64);
      backdrop-filter:blur(7px);
    }

    .sheet.open{display:flex}

    .sheet-panel{
      width:min(430px,100%);
      max-height:88vh;
      overflow:auto;
      border-radius:30px 30px 0 0;
      border:1px solid rgba(255,255,255,.14);
      background:#08111f;
      box-shadow:0 -24px 80px rgba(0,0,0,.55);
      padding:16px 16px calc(16px + env(safe-area-inset-bottom));
    }

    .sheet-head{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      margin-bottom:14px;
    }

    .sheet h3{
      margin:0;
      font-size:25px;
      line-height:1;
      letter-spacing:-.04em;
    }

    .close{
      width:44px;
      height:44px;
      display:grid;
      place-items:center;
      border-radius:15px;
      border:1px solid var(--line);
      background:rgba(255,255,255,.06);
      color:white;
      font-size:24px;
      font-weight:950;
    }

    .form{
      display:grid;
      gap:12px;
    }

    label{
      display:block;
      margin:0 0 7px;
      color:#c8d2e2;
      font-size:12px;
      font-weight:950;
      letter-spacing:.08em;
      text-transform:uppercase;
    }

    input,textarea{
      width:100%;
      min-height:52px;
      border-radius:16px;
      padding:14px;
      outline:none;
      color:var(--text);
      background:var(--field);
      border:1px solid rgba(255,255,255,.13);
    }

    textarea{
      min-height:82px;
      resize:vertical;
      line-height:1.4;
    }

    input:focus,textarea:focus{
      border-color:rgba(56,189,248,.85);
      box-shadow:0 0 0 4px rgba(56,189,248,.13);
    }

    .two{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
    }

    .tips{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:8px;
    }

    .tip{
      min-height:50px;
      border-radius:16px;
      border:1px solid var(--line);
      background:var(--card2);
      color:var(--text);
      font-weight:1000;
    }

    .tip.active{
      color:#03120a;
      border-color:transparent;
      background:linear-gradient(135deg,var(--green),var(--blue));
    }

    .total{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding:14px;
      border-radius:18px;
      background:linear-gradient(90deg,rgba(34,197,94,.16),rgba(34,197,94,.07));
      border:1px solid rgba(34,197,94,.22);
    }

    .total span{
      color:#cbd5e1;
      font-size:12px;
      font-weight:950;
      letter-spacing:.08em;
      text-transform:uppercase;
    }

    .total b{
      color:var(--green2);
      font-size:26px;
      line-height:1;
    }

    .pay-grid{
      display:grid;
      gap:10px;
    }

    .pay{
      min-height:56px;
      display:grid;
      place-items:center;
      border:0;
      border-radius:18px;
      font-size:16px;
      font-weight:1000;
      text-align:center;
    }

    .venmo{background:var(--venmo);color:white}
    .cash{background:var(--cash);color:#03120a}
    .dark{background:rgba(255,255,255,.055);color:var(--text);border:1px solid var(--line)}

    .settings{
      margin-top:12px;
      padding:14px;
      border-radius:22px;
      background:rgba(250,204,21,.06);
      border:1px solid rgba(250,204,21,.22);
    }

    .settings-title{
      margin:0 0 10px;
      color:#fde68a;
      font-weight:1000;
    }

    .toast{
      position:fixed;
      left:50%;
      bottom:20px;
      width:min(390px,calc(100% - 28px));
      z-index:120;
      padding:13px 14px;
      border-radius:18px;
      background:rgba(2,6,23,.94);
      border:1px solid rgba(34,197,94,.35);
      color:#e5fbea;
      box-shadow:0 20px 60px rgba(0,0,0,.45);
      opacity:0;
      pointer-events:none;
      transform:translateX(-50%) translateY(18px);
      transition:.2s ease;
      font-weight:850;
      font-size:14px;
    }

    .toast.show{
      opacity:1;
      transform:translateX(-50%) translateY(0);
    }

    @media(max-width:360px){
      .artist-card{grid-template-columns:66px 1fr}
      .avatar{width:66px;height:66px}
      h1{font-size:26px}
      .two,.quick-grid{grid-template-columns:1fr}
      .tips{grid-template-columns:repeat(2,1fr)}
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="phone">
      <header class="hero">
        <button class="artist-card click" type="button" data-open="profile">
          <span class="avatar"></span>
          <span>
            <h1>Jaxon Rye</h1>
            <p class="tagline">Songs. Stories. Tonight.</p>
            <span class="live"><span class="dot"></span> Live Now</span>
          </span>
        </button>

        <nav class="socials" aria-label="Social links">
          <a class="social click" href="https://instagram.com" target="_blank" rel="noopener" data-toast="Opening Instagram">📸</a>
          <a class="social click" href="https://facebook.com" target="_blank" rel="noopener" data-toast="Opening Facebook">f</a>
          <a class="social click" href="https://tiktok.com" target="_blank" rel="noopener" data-toast="Opening TikTok">♪</a>
          <a class="social click" href="https://spotify.com" target="_blank" rel="noopener" data-toast="Opening Spotify">●</a>
          <a class="social click" href="https://youtube.com" target="_blank" rel="noopener" data-toast="Opening YouTube">▶</a>
        </nav>
      </header>

      <div class="stack">
        <button class="main-action click" type="button" data-open="request">
          <span>
            Request a Song
            <small>Pre-filled form, price, tip, Venmo, Cash App</small>
          </span>
          <span class="arrow">→</span>
        </button>

        <button class="tile click" type="button" data-open="request">
          <span class="tile-head">
            <span class="icon">♫</span>
            <span>
              <h2>Song Request</h2>
              <p class="help">The Night We Met • Request price + tip</p>
            </span>
          </span>
          <span class="meta"><span>Total</span><b id="homeTotal">$15</b></span>
        </button>

        <button class="tile click" type="button" data-open="crowdfund">
          <span class="tile-head">
            <span class="icon" style="background:rgba(168,85,247,.13);border-color:rgba(168,85,247,.28);color:#d8b4fe;">🔓</span>
            <span>
              <h2>Crowdfund a Song</h2>
              <p class="help">Unlock “Fix You” tonight</p>
            </span>
          </span>
          <span class="bar"><span class="fill" id="homeCrowdFill" style="width:55%"></span></span>
          <span class="meta"><span id="homeCrowdText">$275 of $500</span><b id="homeCrowdPct">55%</b></span>
        </button>

        <button class="tile click" type="button" data-open="goal">
          <span class="tile-head">
            <span class="icon" style="background:rgba(56,189,248,.12);border-color:rgba(56,189,248,.26);color:#7dd3fc;">◎</span>
            <span>
              <h2>Tonight’s Goal</h2>
              <p class="help">Help the artist hit tonight’s total</p>
            </span>
          </span>
          <span class="bar"><span class="fill goal" id="homeGoalFill" style="width:68%"></span></span>
          <span class="meta"><span id="homeGoalText">$680 of $1,000</span><b id="homeGoalPct">68%</b></span>
        </button>

        <div class="quick-grid">
          <a class="quick click" href="mailto:booking@example.com?subject=Booking%20Jaxon%20Rye" data-toast="Opening booking email">Book Artist</a>
          <a class="quick click" href="https://calendar.google.com" target="_blank" rel="noopener" data-toast="Opening shows">Upcoming Shows</a>
        </div>

        <button class="quick click" type="button" data-open="settings">⚙️ Artist Settings / Change Prices</button>
      </div>

      <button class="code click" type="button" data-copy-code>
        <span class="ticket">🎟</span>
        <span>
          <small>Your Request Code</small>
          <b id="requestCode">REQ-48291</b>
          <span>Tap to copy request code</span>
        </span>
      </button>
    </section>
  </main>

  <section class="sheet" id="sheet" aria-hidden="true">
    <div class="sheet-panel">
      <div class="sheet-head">
        <h3 id="sheetTitle">Action</h3>
        <button class="close click" type="button" id="closeSheet">×</button>
      </div>
      <div id="sheetBody"></div>
    </div>
  </section>

  <div class="toast" id="toast"></div>

  <script>
    const data = {
      requestCode:"REQ-48291",
      venmo:"jaxonrye",
      cash:"jaxonryemusic",
      song:"The Night We Met",
      fan:"Jordan",
      message:"Huge fan! Love your music 🙌",
      requestPrice:10,
      selectedTip:5,
      customTip:15,
      crowdSong:"Fix You",
      crowdRaised:275,
      crowdTarget:500,
      crowdAmount:10,
      goalRaised:680,
      goalTarget:1000,
      goalAmount:20
    };

    const $ = id => document.getElementById(id);
    const money = n => "$" + Number(n || 0).toLocaleString(undefined,{maximumFractionDigits:0});
    const total = () => Number(data.requestPrice || 0) + Number(data.selectedTip || 0);

    function toast(text){
      const el = $("toast");
      el.textContent = text;
      el.classList.add("show");
      clearTimeout(window.toastTimer);
      window.toastTimer = setTimeout(() => el.classList.remove("show"), 1700);
    }

    function paymentNote(type, amount){
      return `${data.requestCode} | ${type} | ${data.song} | ${data.fan} | $${Number(amount).toFixed(2)} | ${data.message}`;
    }

    function links(amount, note){
      const safe = encodeURIComponent(note);
      const amt = Number(amount || 0).toFixed(2);
      return {
        venmo:`https://venmo.com/${data.venmo}?txn=pay&amount=${amt}&note=${safe}`,
        cash:`https://cash.app/$${data.cash}/${amt}`
      };
    }

    async function copy(text, done){
      try{
        await navigator.clipboard.writeText(text);
        toast(done || "Copied");
      }catch{
        toast(text);
      }
    }

    function progress(raised,target){
      return Math.min(Math.round((Number(raised || 0) / Math.max(Number(target || 1),1)) * 100),100);
    }

    function syncHome(){
      $("homeTotal").textContent = money(total());
      const cp = progress(data.crowdRaised,data.crowdTarget);
      $("homeCrowdFill").style.width = cp + "%";
      $("homeCrowdText").textContent = `${money(data.crowdRaised)} of ${money(data.crowdTarget)}`;
      $("homeCrowdPct").textContent = cp + "%";

      const gp = progress(data.goalRaised,data.goalTarget);
      $("homeGoalFill").style.width = gp + "%";
      $("homeGoalText").textContent = `${money(data.goalRaised)} of ${money(data.goalTarget)}`;
      $("homeGoalPct").textContent = gp + "%";
    }

    function openSheet(type){
      const sheet = $("sheet");
      const title = $("sheetTitle");
      const body = $("sheetBody");

      if(type === "profile"){
        title.textContent = "Artist Profile";
        body.innerHTML = `
          <div class="form">
            <button class="pay dark click" type="button" data-open="request">Request a Song</button>
            <button class="pay dark click" type="button" data-open="crowdfund">Crowdfund a Song</button>
            <a class="pay dark click" href="mailto:booking@example.com?subject=Booking%20Jaxon%20Rye">Book Artist</a>
            <a class="pay dark click" href="https://instagram.com" target="_blank" rel="noopener">Instagram</a>
            <a class="pay dark click" href="https://spotify.com" target="_blank" rel="noopener">Spotify</a>
          </div>`;
      }

      if(type === "request"){
        title.textContent = "Song Request";
        const l = links(total(), paymentNote("Song Request", total()));
        body.innerHTML = `
          <div class="form">
            <div>
              <label>Song</label>
              <input id="songInput" value="${escapeAttr(data.song)}" />
            </div>
            <div class="two">
              <div>
                <label>Your Name</label>
                <input id="fanInput" value="${escapeAttr(data.fan)}" />
              </div>
              <div>
                <label>Request Price</label>
                <input id="priceInput" type="number" min="0" step="1" value="${data.requestPrice}" />
              </div>
            </div>
            <div>
              <label>Shout-out</label>
              <textarea id="messageInput">${escapeHtml(data.message)}</textarea>
            </div>
            <div>
              <label>Extra Tip</label>
              <div class="tips">
                <button class="tip click ${data.selectedTip === 0 ? "active":""}" type="button" data-tip="0">$0</button>
                <button class="tip click ${data.selectedTip === 5 ? "active":""}" type="button" data-tip="5">$5</button>
                <button class="tip click ${data.selectedTip === 10 ? "active":""}" type="button" data-tip="10">$10</button>
                <button class="tip click ${data.selectedTip === data.customTip ? "active":""}" type="button" data-tip="custom">Custom</button>
              </div>
            </div>
            <div id="customTipWrap" style="${data.selectedTip === data.customTip ? "" : "display:none"}">
              <label>Custom Tip</label>
              <input id="customTipInput" type="number" min="0" step="1" value="${data.customTip}" />
            </div>
            <button class="total click" type="button" data-refresh-request>
              <span>Total</span>
              <b id="sheetTotal">${money(total())}</b>
            </button>
            <div class="pay-grid">
              <a class="pay venmo click" id="venmoPay" href="${l.venmo}" target="_blank" rel="noopener">V Pay with Venmo</a>
              <a class="pay cash click" id="cashPay" href="${l.cash}" target="_blank" rel="noopener">💵 Pay with Cash App</a>
              <button class="pay dark click" type="button" data-copy-note>Copy Payment Note</button>
              <button class="pay dark click" type="button" data-open="settings">Change Prices / Links</button>
            </div>
          </div>`;
        bindRequestSheet();
      }

      if(type === "crowdfund"){
        title.textContent = "Crowdfund a Song";
        const amount = Number(data.crowdAmount || 0);
        const note = `${data.requestCode} | Crowdfund ${data.crowdSong} | $${amount.toFixed(2)}`;
        const l = links(amount,note);
        const pct = progress(data.crowdRaised,data.crowdTarget);
        body.innerHTML = `
          <div class="form">
            <button class="tile click" type="button" data-open="settings">
              <span class="tile-head">
                <span class="icon" style="background:rgba(168,85,247,.13);border-color:rgba(168,85,247,.28);color:#d8b4fe;">🔓</span>
                <span>
                  <h2>${escapeHtml(data.crowdSong)}</h2>
                  <p class="help">${money(data.crowdRaised)} of ${money(data.crowdTarget)} raised</p>
                </span>
              </span>
              <span class="bar"><span class="fill" style="width:${pct}%"></span></span>
              <span class="meta"><span>Progress</span><b>${pct}%</b></span>
            </button>
            <div>
              <label>Contribution Amount</label>
              <input id="crowdAmountInput" type="number" min="1" step="1" value="${data.crowdAmount}" />
            </div>
            <a class="pay venmo click" id="crowdVenmoPay" href="${l.venmo}" target="_blank" rel="noopener">V Pay Crowdfund with Venmo</a>
            <a class="pay cash click" id="crowdCashPay" href="${l.cash}" target="_blank" rel="noopener">💵 Pay Crowdfund with Cash App</a>
            <button class="pay dark click" type="button" data-copy-crowd>Copy Crowdfund Note</button>
          </div>`;
        bindCrowdSheet();
      }

      if(type === "goal"){
        title.textContent = "Tonight’s Goal";
        const amount = Number(data.goalAmount || 0);
        const note = `${data.requestCode} | Tonight's Goal | $${amount.toFixed(2)}`;
        const l = links(amount,note);
        const pct = progress(data.goalRaised,data.goalTarget);
        body.innerHTML = `
          <div class="form">
            <button class="tile click" type="button" data-open="settings">
              <span class="tile-head">
                <span class="icon" style="background:rgba(56,189,248,.12);border-color:rgba(56,189,248,.26);color:#7dd3fc;">◎</span>
                <span>
                  <h2>Tonight’s Goal</h2>
                  <p class="help">${money(data.goalRaised)} of ${money(data.goalTarget)} raised</p>
                </span>
              </span>
              <span class="bar"><span class="fill goal" style="width:${pct}%"></span></span>
              <span class="meta"><span>Progress</span><b>${pct}%</b></span>
            </button>
            <div>
              <label>Goal Contribution</label>
              <input id="goalAmountInput" type="number" min="1" step="1" value="${data.goalAmount}" />
            </div>
            <a class="pay venmo click" id="goalVenmoPay" href="${l.venmo}" target="_blank" rel="noopener">V Pay Goal with Venmo</a>
            <a class="pay cash click" id="goalCashPay" href="${l.cash}" target="_blank" rel="noopener">💵 Pay Goal with Cash App</a>
            <button class="pay dark click" type="button" data-copy-goal>Copy Goal Note</button>
          </div>`;
        bindGoalSheet();
      }

      if(type === "settings"){
        title.textContent = "Artist Settings";
        body.innerHTML = `
          <div class="form settings">
            <p class="settings-title">Change prices, goal totals, and payment links</p>
            <div class="two">
              <div>
                <label>Song Request Price</label>
                <input id="setPrice" type="number" min="0" step="1" value="${data.requestPrice}" />
              </div>
              <div>
                <label>Venmo Username</label>
                <input id="setVenmo" value="${escapeAttr(data.venmo)}" />
              </div>
            </div>
            <div>
              <label>Cash App Cashtag</label>
              <input id="setCash" value="${escapeAttr(data.cash)}" />
            </div>
            <div>
              <label>Crowdfund Song</label>
              <input id="setCrowdSong" value="${escapeAttr(data.crowdSong)}" />
            </div>
            <div class="two">
              <div>
                <label>Crowd Raised</label>
                <input id="setCrowdRaised" type="number" min="0" step="1" value="${data.crowdRaised}" />
              </div>
              <div>
                <label>Crowd Goal</label>
                <input id="setCrowdTarget" type="number" min="1" step="1" value="${data.crowdTarget}" />
              </div>
            </div>
            <div class="two">
              <div>
                <label>Tonight Raised</label>
                <input id="setGoalRaised" type="number" min="0" step="1" value="${data.goalRaised}" />
              </div>
              <div>
                <label>Tonight Goal</label>
                <input id="setGoalTarget" type="number" min="1" step="1" value="${data.goalTarget}" />
              </div>
            </div>
            <button class="pay cash click" type="button" data-save-settings>Apply Settings</button>
          </div>`;
      }

      sheet.classList.add("open");
      sheet.setAttribute("aria-hidden","false");
    }

    function closeSheet(){
      $("sheet").classList.remove("open");
      $("sheet").setAttribute("aria-hidden","true");
    }

    function bindRequestSheet(){
      const ids = ["songInput","fanInput","priceInput","messageInput","customTipInput"];
      ids.forEach(id => {
        const el = $(id);
        if(!el) return;
        el.addEventListener("input", () => {
          data.song = $("songInput").value;
          data.fan = $("fanInput").value;
          data.requestPrice = Number($("priceInput").value || 0);
          data.message = $("messageInput").value;
          if($("customTipInput")) data.customTip = Number($("customTipInput").value || 0);
          if(data.selectedTip === data.customTip && $("customTipInput")) data.selectedTip = data.customTip;
          refreshRequestSheet();
          syncHome();
        });
      });

      document.querySelectorAll("[data-tip]").forEach(btn => {
        btn.addEventListener("click", () => {
          document.querySelectorAll("[data-tip]").forEach(b => b.classList.remove("active"));
          btn.classList.add("active");

          if(btn.dataset.tip === "custom"){
            $("customTipWrap").style.display = "";
            data.selectedTip = Number(data.customTip || 0);
            $("customTipInput").focus();
          } else {
            $("customTipWrap").style.display = "none";
            data.selectedTip = Number(btn.dataset.tip || 0);
          }

          refreshRequestSheet();
          syncHome();
          toast(`Tip set to ${money(data.selectedTip)}`);
        });
      });
    }

    function refreshRequestSheet(){
      const sheetTotal = $("sheetTotal");
      if(sheetTotal) sheetTotal.textContent = money(total());

      const note = paymentNote("Song Request", total());
      const l = links(total(),note);
      if($("venmoPay")) $("venmoPay").href = l.venmo;
      if($("cashPay")) $("cashPay").href = l.cash;
    }

    function bindCrowdSheet(){
      $("crowdAmountInput").addEventListener("input", () => {
        data.crowdAmount = Number($("crowdAmountInput").value || 0);
        const note = `${data.requestCode} | Crowdfund ${data.crowdSong} | $${data.crowdAmount.toFixed(2)}`;
        const l = links(data.crowdAmount,note);
        $("crowdVenmoPay").href = l.venmo;
        $("crowdCashPay").href = l.cash;
      });
    }

    function bindGoalSheet(){
      $("goalAmountInput").addEventListener("input", () => {
        data.goalAmount = Number($("goalAmountInput").value || 0);
        const note = `${data.requestCode} | Tonight's Goal | $${data.goalAmount.toFixed(2)}`;
        const l = links(data.goalAmount,note);
        $("goalVenmoPay").href = l.venmo;
        $("goalCashPay").href = l.cash;
      });
    }

    function saveSettings(){
      data.requestPrice = Number($("setPrice").value || 0);
      data.venmo = $("setVenmo").value.trim().replace("@","") || "jaxonrye";
      data.cash = $("setCash").value.trim().replace("$","") || "jaxonryemusic";
      data.crowdSong = $("setCrowdSong").value || "Fix You";
      data.crowdRaised = Number($("setCrowdRaised").value || 0);
      data.crowdTarget = Math.max(Number($("setCrowdTarget").value || 1),1);
      data.goalRaised = Number($("setGoalRaised").value || 0);
      data.goalTarget = Math.max(Number($("setGoalTarget").value || 1),1);
      syncHome();
      toast("Settings applied");
      closeSheet();
    }

    function escapeHtml(str){
      return String(str).replace(/[&<>"']/g, c => ({
        "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
      }[c]));
    }

    function escapeAttr(str){
      return escapeHtml(str).replace(/"/g,"&quot;");
    }

    document.addEventListener("click", e => {
      const open = e.target.closest("[data-open]");
      if(open){
        e.preventDefault();
        openSheet(open.dataset.open);
        return;
      }

      const copyCode = e.target.closest("[data-copy-code]");
      if(copyCode){
        copy(`${data.requestCode} | ${paymentNote("Song Request", total())}`,"Request code copied");
        return;
      }

      const copyNote = e.target.closest("[data-copy-note]");
      if(copyNote){
        copy(paymentNote("Song Request", total()),"Payment note copied");
        return;
      }

      const copyCrowd = e.target.closest("[data-copy-crowd]");
      if(copyCrowd){
        const note = `${data.requestCode} | Crowdfund ${data.crowdSong} | $${Number(data.crowdAmount || 0).toFixed(2)}`;
        copy(note,"Crowdfund note copied");
        return;
      }

      const copyGoal = e.target.closest("[data-copy-goal]");
      if(copyGoal){
        const note = `${data.requestCode} | Tonight's Goal | $${Number(data.goalAmount || 0).toFixed(2)}`;
        copy(note,"Goal note copied");
        return;
      }

      const save = e.target.closest("[data-save-settings]");
      if(save){
        saveSettings();
        return;
      }

      const t = e.target.closest("[data-toast]");
      if(t){
        toast(t.dataset.toast);
      }
    });

    $("closeSheet").addEventListener("click", closeSheet);
    $("sheet").addEventListener("click", e => {
      if(e.target.id === "sheet") closeSheet();
    });

    document.addEventListener("keydown", e => {
      if(e.key === "Escape") closeSheet();
    });

    syncHome();
  </script>
</body>
</html>
