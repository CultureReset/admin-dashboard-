; Seeed XIAO ESP32-S3 Sense — camera, dual mic and Wi-Fi on one module.
;
; NOT YET BUILT ON HARDWARE. Written against the documented APIs and
; contract-tested against the node's protocol schema (see test/firmware.test.ts),
; but no one has flashed this yet. Treat the pin map and the I2S timings as the
; two places most likely to need adjusting on first contact.

[env:seeed_xiao_esp32s3]
platform  = espressif32@^6.9.0
board     = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200

build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
  links2004/WebSockets@^2.6.1
  bblanchon/ArduinoJson@^7.2.0
